name: 验证并构建模块

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 验证脚本与动态补丁
        run: bash tests/verify_module.sh

      - name: 打包模块
        id: pack
        run: |
          chmod +x build.sh
          ./build.sh
          file=$(find . -maxdepth 1 -name 'coloros_gms_fix_*.zip' -printf '%f\n' | head -n 1)
          echo "zip_name=$file" >> "$GITHUB_OUTPUT"
          echo "tag=$(date +'%Y.%m.%d-%H%M')" >> "$GITHUB_OUTPUT"

      - name: 保存构建产物
        uses: actions/upload-artifact@v4
        with:
          name: coloros-gms-fix
          path: ${{ steps.pack.outputs.zip_name }}

      - name: 创建 Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pack.outputs.tag }}
          name: Build ${{ steps.pack.outputs.tag }}
          files: ${{ steps.pack.outputs.zip_name }}
          body: "ColorOS GMS 推送平衡修复自动构建。"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
